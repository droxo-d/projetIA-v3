name: Scheduled RFM Scoring

on:
  schedule:
    - cron: "0 */6 * * *"   # daily at 03:00 UTC — adjust as needed
  workflow_dispatch: {}    # allows manual "Run workflow" trigger too

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Combine transaction files
        # Merges every raw-transaction CSV under data/ into one file.
        # Point source_dir elsewhere if your real exports land somewhere
        # else (e.g. a folder downloaded from S3/a DB in a prior step).
        run: python combine_transactions.py data data/combined_transactions.csv

      - name: Run batch scoring
        run: python scheduler.py data/combined_transactions.csv
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
