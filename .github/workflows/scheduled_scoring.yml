name: Scoring RFM Planifié

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-batch-scoring:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Merge all CSVs from data/ folder
      run: |
        # Keep the header from the first file, append the rest
        head -n 1 data/*.csv | head -n 1 > data/combined.csv
        for file in data/*.csv; do
          tail -n +2 "$file" >> data/combined.csv
        done
        echo "Total lines in combined file:"
        wc -l data/combined.csv

    - name: Run scheduled scoring
      env:
        UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
        UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      run: |
        python scheduler.py data/combined.csv
